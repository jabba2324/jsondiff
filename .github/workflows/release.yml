name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build for multiple platforms
      run: |
        GOOS=darwin GOARCH=amd64 go build -o jsondiff-darwin-amd64
        GOOS=darwin GOARCH=arm64 go build -o jsondiff-darwin-arm64
        GOOS=linux GOARCH=amd64 go build -o jsondiff-linux-amd64
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          jsondiff-darwin-amd64
          jsondiff-darwin-arm64
          jsondiff-linux-amd64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}